services:
  db:
    image: postgres:17

    container_name: devtoolkit-ai-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devtoolkit_ai_development

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .

    container_name: devtoolkit-ai

    depends_on:
      - db

    ports:
      - "3000:3000"

    volumes:
      - .:/app

    env_file:
      - .env

    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres

    stdin_open: true
    tty: true

volumes:
  postgres_data: