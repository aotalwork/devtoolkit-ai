
  default: &default
    adapter: postgresql
    encoding: unicode
    max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    host: <%= ENV.fetch("DATABASE_HOST", "db") %>
    username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
    password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
    port: 5432
  development:
    <<: *default
    database: devtoolkit_ai_development
    host: localhost
    username: postgres
    password: postgres
    port: 5432

  test:
    <<: *default
    database: devtoolkit_ai_test

  production:
    primary: &primary_production
      <<: *default
      database: devtoolkit_ai_production
      username: devtoolkit_ai
      password: <%= ENV["DEVTOOLKIT_AI_DATABASE_PASSWORD"] %>

    cache:
      <<: *primary_production
      database: devtoolkit_ai_production_cache
      migrations_paths: db/cache_migrate

    queue:
      <<: *primary_production
      database: devtoolkit_ai_production_queue
      migrations_paths: db/queue_migrate

    cable:
      <<: *primary_production
      database: devtoolkit_ai_production_cable
      migrations_paths: db/cable_migrate

